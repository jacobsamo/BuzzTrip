name: Bug Report
description: Report a bug or issue with BuzzTrip
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below to help us understand and fix the issue.

  - type: dropdown
    id: application
    attributes:
      label: Application/Area
      description: Which part of BuzzTrip is affected?
      options:
        - Web App
        - Admin Dashboard
        - Mobile App (iOS)
        - Mobile App (Android)
        - Backend/API (Convex)
        - Shared Components
        - Authentication (Clerk)
        - Maps/Markers
        - Places/Reviews
        - Collections
        - Paths/Drawing
        - Analytics
        - Other
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe what should have happened...
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does this occur?
      description: How frequently can you reproduce this issue?
      options:
        - Always (100% reproducible)
        - Often (75% of the time)
        - Sometimes (50% of the time)
        - Rarely (25% of the time)
        - Once (Unable to reproduce)
    validations:
      required: true

  - type: dropdown
    id: when-started
    attributes:
      label: When did this start happening?
      description: Help us identify if this is a regression
      options:
        - Just noticed (within last week)
        - Recently (within last month)
        - A while ago (1-3 months)
        - Long time (3+ months)
        - Since I started using the app
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity/Impact
      description: How severe is this bug?
      options:
        - Critical (App crashes/unusable, data loss)
        - High (Major feature broken, no workaround)
        - Medium (Feature partially broken, workaround exists)
        - Low (Minor issue, cosmetic)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Please provide details about your environment
      placeholder: |
        - OS: [e.g., Windows 11, macOS 14.2, Ubuntu 22.04, iOS 17.1, Android 14]
        - Browser: [e.g., Chrome 120, Safari 17.1, Firefox 121]
        - BuzzTrip Version/Build: [e.g., v1.2.3 or commit hash if known]
        - Device: [e.g., Desktop, iPhone 15 Pro, Samsung Galaxy S23]
        - Screen Resolution: [e.g., 1920x1080, 390x844]
    validations:
      required: true

  - type: textarea
    id: console-errors
    attributes:
      label: Console Errors/Logs
      description: Any error messages from browser console or application logs
      placeholder: |
        Paste any relevant error messages, stack traces, or logs here.
        For browser: Right-click > Inspect > Console tab
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots/Videos
      description: Add screenshots or screen recordings to help explain the problem
      placeholder: |
        Drag and drop images or videos here, or paste URLs to screenshots/recordings.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context about the problem
      placeholder: |
        - Does this happen with specific data/maps/markers?
        - Are there any console warnings?
        - Did you try clearing cache/cookies?
        - Any recent changes to your setup?

  - type: checkboxes
    id: troubleshooting
    attributes:
      label: Troubleshooting Steps Tried
      description: Have you tried any of these?
      options:
        - label: Refreshed the page
        - label: Cleared browser cache/cookies
        - label: Tried a different browser
        - label: Tried incognito/private mode
        - label: Logged out and back in
        - label: Checked network connection
        - label: Updated to latest version

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      description: Please confirm the following
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have provided all the requested information above
          required: true
